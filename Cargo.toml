# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
slint-build = "1.19"

[profile.release]
strip = true
